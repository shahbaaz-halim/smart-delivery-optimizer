# Local / single-host deployment: database + API + web UI.
#
#   cp .env.example .env      # then set DB_PASSWORD
#   docker compose up --build
#   open http://localhost:3000
#
# PostgreSQL runs database/schema.sql and database/import_data.sql on first
# start (empty volume only). To reload data: docker compose down -v

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_delivery_optimizer
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/import_data.sql:/docker-entrypoint-initdb.d/02_import_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d smart_delivery_optimizer"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host by default; uncomment for local SQL access.
    # ports:
    #   - "5432:5432"

  backend:
    build: ./backend
    environment:
      APP_DATA_SOURCE: database
      DB_URL: jdbc:postgresql://db:5432/smart_delivery_optimizer
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  db-data:
