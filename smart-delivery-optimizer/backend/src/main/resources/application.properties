spring.application.name=smart-delivery-optimizer

# ---------------------------------------------------------------
# All environment-specific values come from environment variables
# (12-factor config). Defaults suit local development.
# Never commit real credentials - set DB_PASSWORD in your shell
# or in a .env file (git-ignored). See .env.example.
# ---------------------------------------------------------------

server.port=${PORT:8080}

# Data source: "database" (PostgreSQL) or "csv" (bundled dataset, no DB needed)
app.data-source=${APP_DATA_SOURCE:database}
app.csv.location=${APP_CSV_LOCATION:classpath:data/}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_delivery_optimizer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Start even when the database is not reachable yet (e.g. container start order)
spring.datasource.hikari.initialization-fail-timeout=-1

# Comma-separated list of browser origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Health / readiness probes for containers and Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=${DB_HEALTH_ENABLED:true}

# Graceful shutdown so in-flight requests finish during rolling updates
server.shutdown=graceful
